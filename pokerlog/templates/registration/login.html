{% extends "pokerlog/base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div style="max-width:400px;margin:40px auto;">
  <h1 style="text-align:center;margin-bottom:28px;">Login</h1>
  <div class="card">
    <form method="post">
      {% csrf_token %}
      {% if form.errors %}
        <div class="warning" style="margin-bottom:14px;">Invalid username or password.</div>
      {% endif %}
      <div class="field" style="margin-bottom:14px;">
        <label for="id_username">Username</label>
        <input type="text" name="username" id="id_username" autofocus>
      </div>
      <div class="field" style="margin-bottom:20px;">
        <label for="id_password">Password</label>
        <input type="password" name="password" id="id_password">
      </div>
      <button class="btn" type="submit" style="width:100%;justify-content:center;">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
